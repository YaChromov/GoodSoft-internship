<div class="form-card">
  <h2>{{ t.addOrderTitle || 'ОФОРМЛЕНИЕ ЗАКАЗА' }}</h2>

  <div *ngIf="errorMessage" class="error-banner">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>{{ t.classCol }}</label>
      <input pInputText name="apartmentClass" [(ngModel)]="order.apartmentClass"
             placeholder="Luxury, Standard, etc." required />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>{{ t.capacityCol }}</label>
        <input pInputText type="number" name="capacity" [(ngModel)]="order.capacity"
               min="1" required />
      </div>

      <div class="form-group">
        <label>{{ t.daysCol }}</label>
        <input pInputText type="number" name="stayDays" [(ngModel)]="order.stayDays"
               min="1" required />
      </div>
    </div>

    <div class="form-group">
      <label>{{ t.clientCol }}</label>
      <input pInputText [value]="currentUser" class="readonly-input" readonly />
    </div>

    <button type="submit" class="btn-submit">
      {{ t.submitBtn }}
    </button>

    <a routerLink="/orders" class="back-link">
      {{ t.cancelBtn }}
    </a>
  </form>
</div>
