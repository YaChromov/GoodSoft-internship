<header>
  <div class="logo">XPOM</div>

  <div class="header-right">
    <div class="lang-switcher">
      <a href="javascript:void(0)"
         (click)="setLanguage('ru')"
         class="lang-link"
         [class.active]="currentLang === 'ru'">RU</a>
      <a href="javascript:void(0)"
         (click)="setLanguage('en')"
         class="lang-link"
         [class.active]="currentLang === 'en'">EN</a>
    </div>

    <div class="auth-info"
         *ngIf="authService.currentUser$ | async">

      {{ t.authenticatedAs }}

      <a routerLink="/password-edit" class="user-link">
        <strong>{{ authService.username }}</strong>
      </a>

      <button class="logout-btn" (click)="onLogout()">
        {{ t.logout }}
      </button>
    </div>
  </div>
</header>

<nav *ngIf="authService.currentUser$ | async">
    <div class="nav-links">

      <a *ngIf="!authService.isAdmin" routerLink="/order-create">
        {{ t.addOrderTitle }}
      </a>

      <a *ngIf="authService.isAdmin" routerLink="/order-pending">
        {{ t.pendingOrders }}
      </a>

      <a routerLink="/orders">
        {{ t.orders }}
      </a>

    </div>
</nav>
