<div class="orders-container">
  <p-table [value]="pendingOrders" class="custom-table">
    <ng-template pTemplate="header">
      <tr>
        <th class="col-id">ID</th>
        <th class="col-date">{{ t.birthdayCol }}</th>
        <th class="col-client">{{ t.clientCol }}</th>
        <th class="col-class">{{ t.classCol }}</th>
        <th class="col-cap">{{ t.capacityCol }}</th>
        <th class="col-days">{{ t.daysCol }}</th>
        <th class="col-actions">{{ t.actionsCol }}</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-o>
      <tr>
        <td class="cell-id">#{{ o.id }}</td>
        <td>{{ o.createdAt | date:'dd.MM.yyyy HH:mm' }}</td>
        <td>{{ o.clientUsername }}</td>
        <td>{{ o.apartmentClass }}</td>
        <td>{{ o.capacity }}</td>
        <td>{{ o.stayDays }}</td>
        <td class="cell-actions">
          <button pButton
                  type="button"
                  [label]="t.confirmStatus"
                  class="p-button-sm action-btn approve-btn"
                  (click)="changeStatus(o.id, OrderStatus.CONFIRMED)">
          </button>

          <button pButton
                  type="button"
                  [label]="t.rejectStatus"
                  class="p-button-sm p-button-danger action-btn del-btn"
                  (click)="changeStatus(o.id, OrderStatus.REJECTED)">
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
